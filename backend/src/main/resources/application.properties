# Server Port
server.port=8080

# Application Name
spring.application.name=vehicle-parking-management

# MySQL 8 Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_parking_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Password123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Storage / Exports Directory Path
app.exports.dir=./exports

# Logging Configuration
logging.level.com.parking=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
